# Moves the package pins to the newest green commits of the Abyss source repositories
# (tools/bump.py) and starts the package build. A push with the workflow token does not start
# other workflows, so the build is started explicitly.
name: Update pins

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Move pins to the newest green commits
        run: python3 tools/bump.py | tee bump.log

      - name: Commit, push and build
        run: |
          set -eu
          if git diff --quiet; then
            echo "Nothing to update."
            exit 0
          fi
          git config user.name bb8TheRobot
          git config user.email bb8TheRobot@users.noreply.github.com
          git add -A -- . ':!bump.log'
          git commit -m "Update pins to the newest green commits" -m "$(cat bump.log)"
          git push
          if [ -f .github/workflows/build.yml ]; then
            gh workflow run build.yml --ref main
          fi
